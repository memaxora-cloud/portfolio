<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fun Zone | Labib Shahriar</title>
<meta name="description" content="Take a break — 8 mini games, all built from scratch. labib.fun/fun" />
<meta name="robots" content="index, follow" />
<link rel="canonical" href="https://labib.fun/fun" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css" />
<link rel="stylesheet" href="fun.css" />
</head>
<body>

<div class="scroll-progress" id="scrollProgress"></div>
<div class="cursor-ring" id="cursorRing"></div>
<div class="cursor-dot" id="cursorDot"></div>

<div class="bg-glow"></div>
<div class="dots-field" id="dotsField"></div>

<div class="wrap">

  <header class="navbar">
    <a href="../" class="brand">Labib <span>Shahriar</span></a>

    <nav class="nav-links" id="navLinks">
      <a href="../">Home</a>
      <a href="../#study">Study</a>
      <a href="../#games">Games</a>
      <a href="../library/">Library</a>
      <a href="./">Fun Zone</a>
      <a href="../#contact">Contact</a>
    </nav>

    <div class="nav-cta">
      <a href="../#contact" class="btn-pill">Let's Talk</a>
      <a href="../" class="icon-btn" aria-label="Back home">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M11 19l-7-7 7-7M4 12h16" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 6H20M4 12H20M4 18H20" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <!-- ===== Menu view ===== -->
  <main id="menuView">
    <div class="library-heading">
      <p class="card-label">Fun Zone</p>
      <h1 class="card-heading" style="font-size:1.8rem;">Pick a game</h1>
      <p class="library-sub">Eight tiny games, all built from scratch. Have fun.</p>
    </div>

    <div class="game-menu">
      <button class="game-tile" data-game="ttt">
        <span class="gt-icon">⭕</span>
        <span class="gt-name">Tic Tac Toe</span>
        <span class="gt-desc">You vs the box</span>
      </button>
      <button class="game-tile" data-game="tetris">
        <span class="gt-icon">🍋</span>
        <span class="gt-name">Lemon Tetris</span>
        <span class="gt-desc">Retro clone, lemon blocks</span>
      </button>
      <button class="game-tile" data-game="pong">
        <span class="gt-icon">🏓</span>
        <span class="gt-name">Pong vs AI</span>
        <span class="gt-desc">First to 5 wins</span>
      </button>
      <button class="game-tile" data-game="maze">
        <span class="gt-icon">🧩</span>
        <span class="gt-name">Maze Runner</span>
        <span class="gt-desc">Find the exit</span>
      </button>
      <button class="game-tile" data-game="whack">
        <span class="gt-icon">🐛</span>
        <span class="gt-name">Whack-a-Lemon</span>
        <span class="gt-desc">Quick reflexes</span>
      </button>
      <button class="game-tile" data-game="memory">
        <span class="gt-icon">🧠</span>
        <span class="gt-name">Memory Match</span>
        <span class="gt-desc">Find the pairs</span>
      </button>
      <button class="game-tile" data-game="wordle">
        <span class="gt-icon">🔤</span>
        <span class="gt-name">Dev Wordle</span>
        <span class="gt-desc">Guess the tech word</span>
      </button>
      <button class="game-tile" data-game="clicker">
        <span class="gt-icon">🍋</span>
        <span class="gt-name">Lemon Clicker</span>
        <span class="gt-desc">Click, earn, upgrade</span>
      </button>
    </div>
  </main>

  <!-- ===== Game view ===== -->
  <main id="gameView" class="game-view" hidden>
    <button class="back-btn" id="backBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M11 19l-7-7 7-7M4 12h16" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Back to Fun Zone
    </button>

    <div class="card game-card">
      <h2 class="game-title" id="gameTitle"></h2>
      <div id="gameStage" class="game-stage"></div>
    </div>
  </main>

  <footer class="site-footer">
    <p>Copyright © 2026 <span class="brand-mini">Labib Shahriar</span> — All Rights Reserved</p>
    <nav class="footer-links">
      <a href="../">Home</a>
      <a href="../library/">Library</a>
      <a href="../#contact">Contact</a>
    </nav>
  </footer>

</div>

<script src="fun.js"></script>
</body>
</html>
