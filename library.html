<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Library | Labib Shahriar</title>
<meta name="description" content="A photo album from Labib Shahriar — labib.fun/library" />
<meta name="robots" content="index, follow" />
<link rel="canonical" href="https://labib.fun/library" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="library.css" />
</head>
<body>

<div class="scroll-progress" id="scrollProgress"></div>
<div class="cursor-ring" id="cursorRing"></div>
<div class="cursor-dot" id="cursorDot"></div>

<div class="bg-glow"></div>
<div class="dots-field" id="dotsField"></div>

<div class="wrap">

  <header class="navbar">
    <a href="index.html" class="brand">Labib <span>Shahriar</span></a>

    <nav class="nav-links" id="navLinks">
      <a href="index.html">Home</a>
      <a href="index.html#study">Study</a>
      <a href="index.html#games">Games</a>
      <a href="library.html">Library</a>
      <a href="fun.html">Fun Zone</a>
      <a href="index.html#contact">Contact</a>
    </nav>

    <div class="nav-cta">
      <a href="index.html#contact" class="btn-pill">Let's Talk</a>
      <a href="index.html" class="icon-btn" aria-label="Back home">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M11 19l-7-7 7-7M4 12h16" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 6H20M4 12H20M4 18H20" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <main class="library-main">
    <div class="library-heading">
      <p class="card-label">Photo Album</p>
      <h1 class="card-heading" style="font-size:1.8rem;">Library</h1>
      <p class="library-sub">A few moments, snapshots and things worth remembering. Tap any photo to open it full-size.</p>
    </div>

    <div class="library-grid" id="libraryGrid">
      <!-- thumbnails injected by JS -->
    </div>
  </main>

  <footer class="site-footer">
    <p>Copyright © 2026 <span class="brand-mini">Labib Shahriar</span> — All Rights Reserved</p>
    <nav class="footer-links">
      <a href="index.html">Home</a>
      <a href="fun.html">Fun Zone</a>
      <a href="index.html#contact">Contact</a>
    </nav>
  </footer>

</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lbClose" aria-label="Close">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
  </button>
  <button class="lb-nav lb-prev" id="lbPrev" aria-label="Previous image">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div class="lb-stage">
    <img id="lbImage" src="" alt="Library photo" />
    <p class="lb-counter" id="lbCounter"></p>
  </div>
  <button class="lb-nav lb-next" id="lbNext" aria-label="Next image">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
</div>

<script>
  /* ---------------- Mobile nav toggle ---------------- */
  const navToggle = document.getElementById('navToggle');
  const navLinks = document.getElementById('navLinks');
  navToggle.addEventListener('click', () => navLinks.classList.toggle('open'));
  navLinks.querySelectorAll('a').forEach(link => link.addEventListener('click', () => navLinks.classList.remove('open')));

  /* ---------------- Falling dots background ---------------- */
  const dotsField = document.getElementById('dotsField');
  const DOT_COUNT = window.innerWidth < 720 ? 22 : 44;
  for (let i = 0; i < DOT_COUNT; i++) {
    const dot = document.createElement('span');
    dot.className = 'dot';
    dot.style.left = Math.random() * 100 + 'vw';
    dot.style.animationDuration = (6 + Math.random() * 10) + 's';
    dot.style.animationDelay = '-' + (Math.random() * 10) + 's';
    const size = 2 + Math.random() * 2.5;
    dot.style.width = size + 'px';
    dot.style.height = size + 'px';
    dotsField.appendChild(dot);
  }

  /* ---------------- Scroll progress bar ---------------- */
  const scrollProgress = document.getElementById('scrollProgress');
  function updateScrollProgress() {
    const scrollTop = window.scrollY || document.documentElement.scrollTop;
    const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
    scrollProgress.style.width = (height > 0 ? (scrollTop / height) * 100 : 0) + '%';
  }
  window.addEventListener('scroll', () => requestAnimationFrame(updateScrollProgress));
  updateScrollProgress();

  /* ---------------- Custom cursor ---------------- */
  const isFinePointer = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
  const cursorDot = document.getElementById('cursorDot');
  const cursorRing = document.getElementById('cursorRing');
  if (isFinePointer) {
    document.body.classList.add('has-custom-cursor');
    let mx = innerWidth / 2, my = innerHeight / 2, rx = mx, ry = my;
    window.addEventListener('mousemove', e => {
      mx = e.clientX; my = e.clientY;
      cursorDot.style.transform = `translate(${mx}px, ${my}px) translate(-50%, -50%)`;
    });
    (function loop() {
      rx += (mx - rx) * 0.18; ry += (my - ry) * 0.18;
      cursorRing.style.transform = `translate(${rx}px, ${ry}px) translate(-50%, -50%)`;
      requestAnimationFrame(loop);
    })();
    document.addEventListener('mouseover', e => { if (e.target.closest('a, button, .lb-photo')) cursorRing.classList.add('hovering'); });
    document.addEventListener('mouseout', e => { if (e.target.closest('a, button, .lb-photo')) cursorRing.classList.remove('hovering'); });
  }

  /* ---------------- Library gallery + lightbox ---------------- */
  const PHOTOS = [
    { src: 'image2.png', caption: 'Moment 2' },
    { src: 'image3.png', caption: 'Moment 3' },
    { src: 'image4.png', caption: 'Moment 4' },
    { src: 'image5.png', caption: 'Moment 5' },
    { src: 'image6.png', caption: 'Moment 6' },
    { src: 'image7.png', caption: 'Moment 7' },
    { src: 'image8.png', caption: 'Moment 8' },
    { src: 'image9.png', caption: 'Moment 9' }
  ];

  const grid = document.getElementById('libraryGrid');
  PHOTOS.forEach((p, i) => {
    const btn = document.createElement('button');
    btn.className = 'lb-photo';
    btn.type = 'button';
    btn.innerHTML = `<img src="${p.src}" alt="${p.caption}" loading="lazy" />`;
    btn.addEventListener('click', () => openLightbox(i));
    grid.appendChild(btn);
  });

  const lightbox = document.getElementById('lightbox');
  const lbImage = document.getElementById('lbImage');
  const lbCounter = document.getElementById('lbCounter');
  let currentIndex = 0;

  function openLightbox(i) {
    currentIndex = i;
    renderLightbox();
    lightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeLightbox() {
    lightbox.classList.remove('open');
    document.body.style.overflow = '';
  }
  function renderLightbox() {
    const p = PHOTOS[currentIndex];
    lbImage.src = p.src;
    lbImage.alt = p.caption;
    lbCounter.textContent = `${currentIndex + 1} / ${PHOTOS.length}`;
  }
  function nextImage() { currentIndex = (currentIndex + 1) % PHOTOS.length; renderLightbox(); }
  function prevImage() { currentIndex = (currentIndex - 1 + PHOTOS.length) % PHOTOS.length; renderLightbox(); }

  document.getElementById('lbClose').addEventListener('click', closeLightbox);
  document.getElementById('lbNext').addEventListener('click', nextImage);
  document.getElementById('lbPrev').addEventListener('click', prevImage);
  lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });

  document.addEventListener('keydown', (e) => {
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowRight') nextImage();
    if (e.key === 'ArrowLeft') prevImage();
  });

  /* basic touch swipe support */
  let touchStartX = null;
  lightbox.addEventListener('touchstart', (e) => { touchStartX = e.touches[0].clientX; });
  lightbox.addEventListener('touchend', (e) => {
    if (touchStartX === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    if (dx > 50) prevImage();
    else if (dx < -50) nextImage();
    touchStartX = null;
  });
</script>

</body>
</html>
